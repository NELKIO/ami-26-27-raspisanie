# Пересобирает JSON-API (api/v1/pmi/*.json) из живой таблицы и коммитит, только если расписание
# поменялось. Сам сайт деплоится как раньше — GitHub Pages из ветки main.
# Токен GITHUB_TOKEN живёт только во время задачи и действует только в этом репозитории.
name: API расписания

on:
  schedule:
    - cron: "7,37 * * * *"        # каждые 30 минут (GitHub может запускать с опозданием)
  push:
    branches: [main]
    paths: [index.html, tools/build_api.py, .github/workflows/api.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Сборка API
        env:
          TZ: Europe/Moscow
        run: python -I tools/build_api.py

      - name: Коммит, если расписание поменялось
        id: commit
        run: |
          git add api
          if git diff --cached --quiet; then
            echo "Расписание не поменялось"
            echo "changed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "API: обновлено расписание из таблицы"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Пересобрать Pages
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
